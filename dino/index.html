<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No internet connection - Web page not available</title>
  <link rel="stylesheet" href="https://www.google.com/style.css">
  <script src="https://www.google.com/dino.js" defer></script>
</head>
<body>
  <main>
    <h1>No Internet Connection</h1>
    <p>No Internet Connection or No Wi-Fi</p>

    <ul>
      <li>Activate airplane mode</li>
      <li>Wi-Fi is off</li>
      <li>Failed to connect — try again later.</li>
    </ul>

    <iframe
      src="https://chromedino.com/embed"
      title="Chrome Dino Game"
      width="600"
      height="150"
      frameborder="0"
      loading="lazy"
    ></iframe>
  </main>
</body>
</html>
